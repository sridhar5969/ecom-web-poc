<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found</title>
  </head>
  <body>
    <script>
      // Fetch production index.html and inject it so SPA can handle the current path
      (function () {
        try {
          fetch('/index.html', { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .catch(function () {
              document.body.innerHTML = 'Not Found';
            });
        } catch (e) {
          document.body.innerHTML = 'Not Found';
        }
      })();
    </script>
  </body>
</html>
